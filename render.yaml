services:
  - type: web
    name: thepotlite-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn thepot.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: thepotlite-postgres
          property: connectionString

databases:
  - name: thepotlite-postgres
    plan: free
    databaseName: thepot_db
    user: thepot_user
